<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" type="text/css" href="css/tools.css">
<script>
var title = 'Logbuch';
document.title = title;

function handleDrop(evt)
{
	evt.stopPropagation();
	evt.preventDefault();

	if (evt.dataTransfer.files.length > 0)
	{
		var file = evt.dataTransfer.files[0];
		var reader = new FileReader();

		reader.onload = function (e)
		{
			evt.target.value = e.target.result;
			document.getElementById('process').disabled =
				document.getElementById('slack').value.length == 0;
		};

		reader.readAsText(file);
	}
};

function handleDragOver(evt)
{
	evt.stopPropagation();
	evt.preventDefault();
};

function printResult()
{
	var w = window.open();
	w.document.write(document.getElementById('result').value);
	w.document.close();
	w.print();
};

function dateString(date)
{
	return date.getDate() + '.' + (date.getMonth() + 1) +
		'.' + date.getFullYear();
};

function parseDate(text)
{
	var parts = text.split('.');

	return new Date(parts[1] + '/' + parts[0] + '/' + parts[2]);
};

function csvToArray(text)
{
	if (text.length > 0)
	{
		var p = '', row = [''], i = 0, s = !0, l;

		for (l of text)
		{
			if ('"' === l)
			{
				if (s && l === p)
				{
					row[i] += l;
				}

				s = !s;
			}
			else if (',' === l && s)
			{
				l = row[++i] = '';
			}
			else
			{
				row[i] += l;
			}

			p = l;
		}
		
		return row;
	}
	else
	{
		return [];
	}
};

function parseSlack()
{
	var logLines = document.getElementById("slack").
		value.split("\n").reverse();
	var slackByDate = {};
	var index = 1;

	while (index < logLines.length - 1)
	{
		var entry = csvToArray(logLines[index], ',');
		var date = dateString(new Date(entry[0]));

		if (slackByDate[date] == null)
		{
			slackByDate[date] = [];
		}
		
		slackByDate[date].push(entry);
		index += 1;
	}

	return slackByDate;
};

function getKeys(obj)
{
	var result = [];

	for (var key in obj)
	{
		result.push(key);
	}

	return result;
};

function isValidAddress(ip, includeTokens, excludeTokens)
{
	for (var i = 0; i < excludeTokens.length; i++)
	{
		if (ip.substring(0, excludeTokens[i].length) == excludeTokens[i])
		{
			return false;
		}
	}

	for (var i = 0; i < includeTokens.length; i++)
	{
		if (ip.substring(0, includeTokens[i].length) == includeTokens[i])
		{
			return true;
		}
	}

	return false;
};

function process()
{
	try
	{
		var from = parseDate(document.getElementById('from').value);
		var to = parseDate(document.getElementById('to').value);
		var days = parseInt(document.getElementById('days').value);
		var include = document.getElementById('include').value.split(' ');
		var exclude = document.getElementById('exclude').value.split(' ');
		var logsByDate = parseSlack();
		var after = null;
		var start = null;
		var end = null;
		var dates = {};

		for (var date in logsByDate)
		{
			var ts = parseDate(date);

			if (ts >= from && ts <= to)
			{
				var logs = logsByDate[date];

				for (var i = 0; i < logs.length; i++)
				{
					if (isValidAddress(logs[i][3],
						include, exclude))
					{
						end = date;

						if (start == null)
						{
							start = date;
						}

						if (dates[date] == null)
						{
							dates[date] = [];
						}

						dates[date].push(logs[i]);
					}
				}
			}
		}

		var total = 0;
		var result = '<table border="1" cellpadding="3" style="font-size:small;border-collapse:collapse;" width="100%">' +
			'<thead><tr><td></td><td align="center">Date</td><td align="center">User Agents</td>' +
			'<td align="center">Logins</td><td align="center">IP Addresses</td></tr></thead><tbody>';

		for (var key in dates)
		{
			var entries = dates[key];
			var agents = {};
			var logins = 0;
			var ips = {};

			for (var i = 0; i < entries.length; i++)
			{
				logins += parseInt(entries[i][4]);
				var agent = entries[i][2];
				var ip = entries[i][3];

				if (agents[agent] == null)
				{
					agents[agent] = true;
				}

				if (ips[ip] == null)
				{
					ips[ip] = true;
				}
			}
			
			var allIps = getKeys(ips);
			var ipLinks = [];

			for (var i = 0; i < allIps.length; i++)
			{
				ipLinks.push('<a href="https://ipwho.is/' + allIps[i] +
					'?output=csv&fields=ip,connection.isp">' + allIps[i] + '</a>');
			}

			total += 1;
			result += '<tr><td valign="top" align="center">' + total + '</td>' +
				'<td valign="top" align="center" style="white-space:nowrap;">' + key +
				'</td><td valign="top">' + getKeys(agents).join('<br>') +
				'</td><td align="center" valign="top">' + logins +
				'</td><td align="center" valign="top">' +
					ipLinks.join('<br>') + '</td></tr>';
		}

		result += '</tbody></table>';

		var today = new Date();
		var pageTitle = title + ' draw.io AG ' + start + ' - ' + end;
		var ts = String(today.getFullYear()) + ('0' + (today.getMonth() + 1)).slice(-2) +
			('0' + today.getDate()).slice(-2) + ('0' + today.getHours()).slice(-2) + ('0' +
			today.getMinutes()).slice(-2) + ('0' + today.getSeconds()).slice(-2);
		document.title = ts + '-' + pageTitle;
		var label = document.getElementById('label').value;
		var perc = Math.round(total / days * 1000) / 10;
		document.getElementById('result').value = '<html><head><meta charset="UTF-8">' +
			'<title>' + pageTitle + '</title></head>' + '<body><h3 style="margin-bottom:6px;">' + pageTitle + '</h3>' +
			result + '<div style="margin-top:8px;">Total ' + label + ': ' + total + ' von ' + days +
			' Arbeitstagen (' + perc + '%)' + '</div></body></html>';
		document.getElementById('summary').innerHTML =
			label + ' ' + start + ' - ' + end + ': ' +
			total + ' of ' + days + ' workdays (' + perc + '%)';
		document.getElementById('print').disabled = false;
	}
	catch (e)
	{
		console.error(e);
		alert(e);
	}
};
</script>
</head>
<body>
<div style="display:flex;opacity:0.9;align-items:center;padding:20px 20px 10px 20px;">
	<svg viewBox="24 26 68 68" style="width:28px;display:inline-block;">
	<line y2="72.394" x2="41.061" y1="43.384" x1="58.069" stroke-miterlimit="10" stroke-width="3.5528"
		stroke="currentColor" fill="none" />
	<line y2="72.394" x2="75.076" y1="43.384" x1="58.068" stroke-miterlimit="10" stroke-width="3.5008"
		stroke="currentColor" fill="none" />
	<path
		d="M52.773,77.084c0,1.954-1.599,3.553-3.553,3.553H36.999c-1.954,0-3.553-1.599-3.553-3.553v-9.379c0-1.954,1.599-3.553,3.553-3.553h12.222c1.954,0,3.553,1.599,3.553,3.553V77.084z"
		fill="currentColor" />
	<path
		d="M67.762,48.074c0,1.954-1.599,3.553-3.553,3.553H51.988c-1.954,0-3.553-1.599-3.553-3.553v-9.379c0-1.954,1.599-3.553,3.553-3.553H64.21c1.954,0,3.553,1.599,3.553,3.553V48.074z"
		fill="currentColor" />
	<path
		d="M82.752,77.084c0,1.954-1.599,3.553-3.553,3.553H66.977c-1.954,0-3.553-1.599-3.553-3.553v-9.379c0-1.954,1.599-3.553,3.553-3.553h12.222c1.954,0,3.553,1.599,3.553,3.553V77.084z"
		fill="currentColor" />
	</svg>
	<span style="font-family:Helvetica;font-weight:700;font-size:20px;margin-left:4px;">draw.io</span>
</div>
<div style="display:block;align-items:center;padding:20px;">
	<textarea id="slack" style="width:100%;height:120px;"
	spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" ondragover="handleDragOver(event);" ondrop="handleDrop(event);"
	placeholder="Paste Slack access log here."></textarea>
	<div style="position:relative;display:flex;align-items:center;justify-items:stretch;padding:4px 0 10px 0;white-space:nowrap;">
		<div style="opacity:0.5;">
			Include: <input id="include" type="text" value="144. 178." size="8">
		</div>
		<div style="opacity:0.5;margin-left:10px;">
			Exclude: <input id="exclude" type="text" value="178.197." size="8">
		</div>
		<div style="opacity:0.5;margin-left:10px;">
			From: <input id="from" type="text" size="10">
		</div>
		<div style="opacity:0.5;margin-left:10px;">
			To: <input id="to" type="text" size="10">
		</div>
		<div style="opacity:0.5;margin-left:10px;">
			Days: <input id="days" type="text" value="240" size="3">
		</div>
		<div style="opacity:0.5;margin-left:10px;">
			Place: <input id="label" type="text" value="Obwalden" size="8">
		</div>
		<button style="position:relative;margin-left:auto;" onclick="window.open('http://my.slack.com/account/logs');">
			Get Access Log
		</button>
		<button id="process" onclick="process();" disabled="disabled" style="position:relative;margin-left:10px;">
			Generate Report
		</button>
	</div>
	<textarea id="result" style="width:100%;height:300px;background:transparent;" spellcheck="false" autocomplete="off"
	autocorrect="off" autocapitalize="off" ondragover="handleDragOver(event);" ondrop="handleDrop(event);" disabled="disabled"></textarea>
	<div style="position:relative;display:flex;align-items:center;justify-items:stretch;padding:4px 0 10px 0;">
		<div style="opacity:0.5;margin-left:auto;" id="summary"></div>
		<button disabled="disabled" onclick="printResult();" id="print" style="position:relative;margin-left:10px;">
			Print Report
		</button>
	</div>
</div>
<script>
	var today = new Date();
	document.getElementById('from').value = '1.1.' + today.getFullYear();
	document.getElementById('to').value = '31.12.' + today.getFullYear();
	document.getElementById('slack').focus();

	// Enabled process button if input is not empty
	document.getElementById('slack').oninput = function()
	{
		document.getElementById('process').disabled =
			document.getElementById('slack').value.length == 0;
	};
</script>
</body>
</html>
